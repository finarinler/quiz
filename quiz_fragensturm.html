<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>WoW Quiz - Fragensturm</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="quiz-container active" id="start-screen">
    <h1>Der Fragensturm</h1><br>
    <p>Teste dein Wissen mit **allen** verfügbaren Fragen!</p>
    <button id="start-btn" class="menu-box">Quiz starten</button>
  </div>

  <div class="quiz-container" id="countdown-screen">
    <h2>Bereit?</h2>
    <div class="countdown" id="countdown">5</div>
  </div>

  <div class="quiz-container" id="game-screen">
    <div id="dynamic-content">
      <div class="progress-container">
        <span id="progress-text">Frage 1 von 20</span>
        <div class="progress-bar-container">
          <div id="progress-bar"></div>
        </div>
      </div>
      
      <div class="quiz-content">
        <h2 id="question">Lade Frage...</h2>
        <div id="answers"></div>
        <div id="answer-generation-message" class="hidden">Antworten werden generiert...</div>
  
        <div class="timer-container">
          <div id="timer-bar" class="timer-bar"></div>
          <span id="time-text">30s</span>
        </div>
  
        <div id="result"></div>
        <div id="next-btn-container">
          <button id="next-question-btn" class="hidden">Nächste Frage</button>
        </div>
      </div>
    </div>
  </div>

  <div class="quiz-container" id="end-screen">
    <div id="end-content"></div>
    <div id="end-actions">
        <button id="restart-btn" class="menu-box">Nochmal spielen</button>
        <button id="main-menu-btn" class="menu-box">Zum Hauptmenü</button>
    </div>
  </div>

  <div id="version-number">v0.1 (Implementierungs-Update)</div>
  <div id="creator-info">Created by 'finarinler' in Cooperation with KI</div>

  <script src="questions.js"></script>
  <script src="quiz_fragensturm.js"></script>
</body>
</html>
